[workspace]
resolver = "2"
members = ["crates/pk-med-fhir", "crates/pk-med-records", "crates/pk-med-smart", "crates/pk-med-dicom"]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/medical-common"
homepage = "https://github.com/piekstra/medical-common"
authors = ["piekstra"]

[workspace.dependencies]
# Every pk-cli-* on one cli-common tag, and the same tag the consuming CLIs
# pin: two tags in one build are two copies of every pk-cli-core type.
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.1" }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.1" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.1" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.1" }
pk-med-fhir = { path = "crates/pk-med-fhir", version = "0.4.1" }
serde = { version = "1", features = ["derive"] }
# raw_value: a resource is kept as the server's own text (pk_med_fhir::raw).
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
base64 = "0.22"
zeroize = "1"
# The deflated transfer syntax, in pk-med-dicom.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The mock server's PKCE S256 check (feature test-util only).
sha2 = "0.11"

# Inflating in tests (pk-med-dicom's deflated syntax and its 256 MiB cap)
# at release speed.
[profile.dev.package.miniz_oxide]
opt-level = 3
