[package]
name = "pk-med-fhir"
description = "Our own FHIR R4 / US Core types, lossless on a round trip, and a read client over the piekstra-cli transport seam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# A loopback mock SMART + FHIR server and the synthetic patient it serves.
test-util = ["dep:sha2"]

[dependencies]
pk-cli-core = { workspace = true }
pk-cli-secrets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
pk-cli-http = { workspace = true }
pk-med-fhir = { path = ".", features = ["test-util"] }
